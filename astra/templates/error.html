<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} — ASTRA</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 1rem;
      background: radial-gradient(800px 500px at 50% 0%, rgba(59,130,246,.18), transparent 60%), var(--bg); }
    .err { text-align: center; max-width: 460px; padding: 2.5rem 2rem; }
    .err .code { font-family: var(--font-display); font-size: 4.5rem; color: var(--accent); text-shadow: 0 0 30px rgba(var(--accent-rgb), .6); line-height: 1; }
  </style>
</head>
<body>
  <main class="panel corners err">
    <div class="code">{{ code }}</div>
    <p class="display muted" style="margin:.8rem 0 1.4rem;font-size:.8rem">Signal lost</p>
    <p>{{ message }}</p>
    <p style="margin-top:1.6rem"><a class="btn primary" href="/">Return to base</a></p>
  </main>
</body>
</html>
