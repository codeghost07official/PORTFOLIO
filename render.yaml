# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: astra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker keeps in-process caches coherent and fits the 512 MB free tier;
    # threads handle concurrency (AI calls are I/O bound).
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ASTRA_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_SAMPLE_DATA
        value: "true"
      # ---- fill these in the Render dashboard (never commit them) ----
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_LOGIN_PATH
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.7-flash,gemini-flash-latest
